[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kerbside"
version = "0.1.0"
description = "Classical-DIP traffic analytics from a fixed roadside camera"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
kerbside = "kerbside.serve:main"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["kerbside*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
module = ["cv2.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["kerbside"]

[tool.coverage.run]
source = ["backend/kerbside"]
